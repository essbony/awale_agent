[mypy]
python_version = 3.11
# Tolérant : le code existant n'est pas entièrement typé, on ne bloque pas la CI
ignore_missing_imports = True
allow_untyped_defs = True
allow_untyped_calls = True
check_untyped_defs = False
warn_return_any = False
warn_unused_configs = False
warn_redundant_casts = False
warn_unused_ignores = False
show_error_codes = True
disable_error_code = attr-defined, method-assign, import-not-found, import-untyped, annotation-unchecked
explicit_package_bases = True
mypy_path = .

# Exclure les caches et venv
exclude = (?x)
    ^\.venv/
  | ^__pycache__/
  | ^\.mypy_cache/
  | ^\.pytest_cache/

[mypy.plugins.*]
follow_imports = skip
